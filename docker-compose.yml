
services:
  streamlit-app:
    build:
      context: .
      dockerfile: app/chatbot-ui/Dockerfile
    ports:
      - "8501:8501"
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./app/chatbot-ui/src:/app/app/chatbot-ui/src
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: app/api/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./app/api/src:/app/app/api/src
    command: uvicorn api.app:app --host 0.0.0.0 --port 8000
