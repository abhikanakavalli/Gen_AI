[project]
name = "Gen_AI"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "abhikanakavalli", email = "abhikanakavalli98@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.28.0",
    "groq>=1.7.0",
    "ipykernel>=7.4.0",
    "openai>=3.24.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.65.0",
]


[tool.uv]
# The repo root is only a workspace container (real code lives in app/api and
# app/chatbot-ui). There is no root package to install, so treat it as virtual.
package = false

[tool.uv.workspace]
members = [
    "app/api",
    "app/chatbot-ui",
]
