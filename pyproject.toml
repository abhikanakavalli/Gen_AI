[project]
name = "Abhi AI"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "abhikanakavalli", email = "abhikanakavalli98@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.28.0",
    "groq>=1.7.0",
    "ipykernel>=7.4.0",
    "openai>=3.24.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.65.0",
]


[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "app/api",
    "app/chatbot-ui",
]
