
[project]
name = "chatbot-ui"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "abhikanakavalli", email = "abhikanakavalli@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "streamlit>=1.65.0",
    "requests>=2.32.0",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
shared = { workspace = true }

[tool.uv.build-backend]
module-name = "chatbot_ui"
module-root = "src"
